<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0a0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Login RM">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-152x152.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/icon-192x192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/icon-512x512.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192x192.png">
  <title>Login RM</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Exo+2:wght@300;600;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0a0f;
      --panel: #12121a;
      --border: #1e1e2e;
      --accent: #00e5ff;
      --accent2: #7c3aed;
      --text: #e2e8f0;
      --muted: #64748b;
      --danger: #f43f5e;
      --success: #10b981;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Exo 2', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(0,229,255,.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,229,255,.04) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }
    body::after {
      content: '';
      position: fixed;
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(124,58,237,.15) 0%, transparent 70%);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      animation: pulse 4s ease-in-out infinite;
    }
    @keyframes pulse {
      0%,100% { transform:translate(-50%,-50%) scale(1); opacity:.6; }
      50%      { transform:translate(-50%,-50%) scale(1.15); opacity:1; }
    }

    /* ── SCREENS ── */
    .screen { display:none; width:100%; max-width:400px; position:relative; z-index:1; }
    .screen.active { display:flex; flex-direction:column; align-items:center; }

    /* ── WELCOME ── */
    #welcomeScreen {
      text-align: center;
      padding: 0 24px;
      animation: fadeIn .6s ease both;
    }
    @keyframes fadeIn {
      from { opacity:0; transform:translateY(20px); }
      to   { opacity:1; transform:translateY(0); }
    }
    .welcome-icon {
      width: 90px; height: 90px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 24px;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 40px;
      margin-bottom: 28px;
      box-shadow: 0 0 50px rgba(0,229,255,.35);
      animation: iconPop .7s cubic-bezier(.16,1,.3,1) .1s both;
    }
    @keyframes iconPop {
      from { transform:scale(.6); opacity:0; }
      to   { transform:scale(1);  opacity:1; }
    }
    .welcome-title {
      font-size: 36px;
      font-weight: 800;
      letter-spacing: .5px;
      line-height: 1.1;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #fff 40%, var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .welcome-sub {
      font-size: 14px;
      color: var(--muted);
      font-family: 'Share Tech Mono', monospace;
      margin-bottom: 48px;
      line-height: 1.7;
    }
    .welcome-sub span {
      display: inline-block;
      background: rgba(0,229,255,.08);
      border: 1px solid rgba(0,229,255,.2);
      color: var(--accent);
      border-radius: 6px;
      padding: 2px 10px;
      font-size: 13px;
    }
    .features {
      display: flex;
      gap: 12px;
      margin-bottom: 48px;
      width: 100%;
    }
    .feature {
      flex: 1;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 12px;
      text-align: center;
    }
    .feature-icon { font-size: 22px; margin-bottom: 8px; }
    .feature-label { font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
    .btn-welcome {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, var(--accent), #00b8d9);
      border: none; border-radius: 12px;
      color: #000; font-family: 'Exo 2', sans-serif;
      font-size: 16px; font-weight: 800;
      letter-spacing: 1px; text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 0 30px rgba(0,229,255,.35);
      transition: opacity .2s, transform .1s, box-shadow .2s;
      margin-bottom: 16px;
    }
    .btn-welcome:hover  { opacity:.9; box-shadow:0 0 40px rgba(0,229,255,.5); }
    .btn-welcome:active { transform:scale(.98); }
    .version {
      font-size: 11px;
      color: var(--muted);
      font-family: 'Share Tech Mono', monospace;
    }

    /* ── LOGIN CARD ── */
    #loginScreen { animation: slideUp .5s cubic-bezier(.16,1,.3,1) both; }
    @keyframes slideUp {
      from { opacity:0; transform:translateY(30px); }
      to   { opacity:1; transform:translateY(0); }
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 48px 40px;
      width: 100%;
      box-shadow: 0 0 60px rgba(0,229,255,.06), 0 32px 64px rgba(0,0,0,.5);
      position: relative;
    }
    .card::before {
      content: '';
      position: absolute; inset: 0;
      border-radius: 16px;
      padding: 1px;
      background: linear-gradient(135deg, rgba(0,229,255,.3), transparent 50%, rgba(124,58,237,.2));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }
    .card-back {
      background: none; border: none; cursor: pointer;
      color: var(--muted); font-family: 'Exo 2', sans-serif;
      font-size: 13px; margin-bottom: 20px; padding: 0;
      display: flex; align-items: center; gap: 6px;
      transition: color .2s;
    }
    .card-back:hover { color: var(--accent); }
    .logo { text-align:center; margin-bottom:32px; }
    .logo-icon {
      width:52px; height:52px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius:14px;
      display:inline-flex; align-items:center; justify-content:center;
      font-size:22px; margin-bottom:12px;
      box-shadow: 0 0 25px rgba(0,229,255,.3);
    }
    .logo h1 { font-size:20px; font-weight:800; letter-spacing:.5px; }
    .logo p  { font-size:11px; color:var(--muted); font-family:'Share Tech Mono',monospace; margin-top:4px; }
    .field { margin-bottom:18px; }
    label {
      display:block; font-size:11px; font-weight:600;
      text-transform:uppercase; letter-spacing:1.5px;
      color:var(--muted); margin-bottom:8px;
    }
    input {
      width:100%; background:#0d0d14;
      border:1px solid var(--border); border-radius:8px;
      padding:12px 16px; color:var(--text);
      font-family:'Share Tech Mono',monospace; font-size:16px;
      outline:none; transition:border-color .2s, box-shadow .2s;
    }
    input:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(0,229,255,.1); }
    input.error { border-color:var(--danger); box-shadow:0 0 0 3px rgba(244,63,94,.1); animation:shake .3s ease; }
    @keyframes shake {
      0%,100% { transform:translateX(0); }
      25% { transform:translateX(-6px); }
      75% { transform:translateX(6px); }
    }
    .btn {
      width:100%; padding:14px;
      background:linear-gradient(135deg,var(--accent),#00b8d9);
      border:none; border-radius:8px;
      color:#000; font-family:'Exo 2',sans-serif;
      font-size:15px; font-weight:800;
      letter-spacing:1px; text-transform:uppercase;
      cursor:pointer; margin-top:8px;
      transition:opacity .2s,transform .1s,box-shadow .2s;
      box-shadow:0 0 20px rgba(0,229,255,.3);
    }
    .btn:hover  { opacity:.9; box-shadow:0 0 30px rgba(0,229,255,.5); }
    .btn:active { transform:scale(.98); }
    .btn:disabled { opacity:.5; cursor:not-allowed; }
    .msg {
      margin-top:14px; padding:12px 16px; border-radius:8px;
      font-size:13px; font-weight:600; display:none; text-align:center;
    }
    .msg.danger  { display:block; background:rgba(244,63,94,.1); border:1px solid rgba(244,63,94,.3); color:var(--danger); }
    .msg.success { display:block; background:rgba(16,185,129,.1); border:1px solid rgba(16,185,129,.3); color:var(--success); }

    /* ── DASHBOARD ── */
    #dashScreen {
      text-align:center;
      padding: 0 24px;
      animation: fadeIn .4s ease both;
    }
    .dash-avatar {
      width:80px; height:80px;
      background:linear-gradient(135deg,var(--accent),var(--accent2));
      border-radius:50%; display:inline-flex;
      align-items:center; justify-content:center;
      font-size:32px; margin-bottom:20px;
      box-shadow:0 0 40px rgba(0,229,255,.4);
    }
    #dashScreen h2 { font-size:28px; font-weight:800; margin-bottom:6px; }
    #dashScreen p  { color:var(--muted); font-family:'Share Tech Mono',monospace; font-size:13px; margin-bottom:28px; }
    .badge {
      display:inline-block; background:rgba(0,229,255,.1);
      border:1px solid rgba(0,229,255,.3); color:var(--accent);
      padding:6px 16px; border-radius:100px;
      font-size:12px; font-family:'Share Tech Mono',monospace; margin-bottom:28px;
    }
    .logout {
      background:transparent; border:1px solid var(--border);
      color:var(--muted); padding:10px 24px; border-radius:8px;
      cursor:pointer; font-family:'Exo 2',sans-serif; font-size:13px;
      transition:all .2s;
    }
    .logout:hover { border-color:var(--danger); color:var(--danger); }

    /* ── PWA BANNER ── */
    #pwa-banner {
      position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
      background:#1a1a2e; border:1px solid var(--accent);
      border-radius:12px; padding:14px 20px;
      font-size:13px; color:var(--text);
      box-shadow:0 0 30px rgba(0,229,255,.2);
      z-index:999; width:90%; max-width:380px;
      display:none; align-items:center; gap:12px;
    }
    #pwa-banner button {
      background:var(--accent); color:#000;
      border:none; border-radius:8px; padding:8px 16px;
      font-weight:800; font-size:12px; cursor:pointer; white-space:nowrap;
    }
    #pwa-banner .close-btn {
      background:transparent; color:var(--muted);
      border:none; cursor:pointer; font-size:18px; margin-left:auto;
    }

    @media (max-width:440px) {
      .card { padding:36px 24px; }
      .welcome-title { font-size:28px; }
      .features { gap:8px; }
    }
  </style>
</head>
<body>

<!-- TELA 1: BEM-VINDO -->
<div class="screen active" id="welcomeScreen">
  <div class="welcome-icon">🔐</div>
  <h1 class="welcome-title">Login RM</h1>
  <p class="welcome-sub">
    Acesso exclusivo para alunos cadastrados<br>
    <span>Sistema de Autenticação v1.0</span>
  </p>
  <div class="features">
    <div class="feature">
      <div class="feature-icon">🛡️</div>
      <div class="feature-label">Seguro</div>
    </div>
    <div class="feature">
      <div class="feature-icon">📲</div>
      <div class="feature-label">PWA</div>
    </div>
    <div class="feature">
      <div class="feature-icon">⚡</div>
      <div class="feature-label">Rápido</div>
    </div>
  </div>
  <button class="btn-welcome" onclick="goTo('loginScreen')">Entrar →</button>
  <p class="version">v1.0.0 · Login RM</p>
</div>

<!-- TELA 2: LOGIN -->
<div class="screen" id="loginScreen">
  <div class="card">
    <button class="card-back" onclick="goTo('welcomeScreen')">← Voltar</button>
    <div class="logo">
      <div class="logo-icon">🔐</div>
      <h1>Acesso Seguro</h1>
      <p>INFORME SEU RM E NOME</p>
    </div>
    <div class="field">
      <label>RM — Registro do Aluno</label>
      <input type="text" id="rmInput" placeholder="00000" maxlength="10" autocomplete="off">
    </div>
    <div class="field">
      <label>Nome</label>
      <input type="text" id="nomeInput" placeholder="Seu nome" autocomplete="off">
    </div>
    <button class="btn" id="loginBtn" onclick="login()">Entrar</button>
    <div class="msg" id="msg"></div>
  </div>
</div>

<!-- TELA 3: DASHBOARD -->
<div class="screen" id="dashScreen">
  <div class="dash-avatar">👤</div>
  <h2 id="welcomeName"></h2>
  <p id="welcomeRM"></p>
  <div class="badge">✅ ACESSO AUTORIZADO</div><br>
  <button class="logout" onclick="logout()">Sair</button>
</div>

<!-- PWA BANNER -->
<div id="pwa-banner">
  <span>📲 Instalar o app na tela inicial</span>
  <button id="pwa-install-btn">Instalar</button>
  <button class="close-btn" onclick="document.getElementById('pwa-banner').style.display='none'">✕</button>
</div>

<script>
  const CREDENCIAIS = { rm: '26567', nome: 'RENAN' };
  let deferredPrompt = null;

  function goTo(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  // PWA install
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    document.getElementById('pwa-banner').style.display = 'flex';
  });
  document.getElementById('pwa-install-btn').addEventListener('click', async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    document.getElementById('pwa-banner').style.display = 'none';
  });
  window.addEventListener('appinstalled', () => {
    document.getElementById('pwa-banner').style.display = 'none';
  });

  // Service Worker
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then(r => console.log('SW:', r.scope))
        .catch(e => console.warn('SW erro:', e));
    });
  }

  function login() {
    const rm   = document.getElementById('rmInput').value.trim();
    const nome = document.getElementById('nomeInput').value.trim().toUpperCase();
    const msg  = document.getElementById('msg');
    const rmI  = document.getElementById('rmInput');
    const nmI  = document.getElementById('nomeInput');
    const btn  = document.getElementById('loginBtn');
    msg.className = 'msg';
    if (!rm || !nome) { msg.textContent = 'Preencha todos os campos.'; msg.className = 'msg danger'; return; }
    btn.disabled = true; btn.textContent = 'Verificando...';
    setTimeout(() => {
      if (rm === CREDENCIAIS.rm && nome === CREDENCIAIS.nome) {
        document.getElementById('welcomeName').textContent = nome;
        document.getElementById('welcomeRM').textContent = 'RM: ' + rm;
        localStorage.setItem('logado', '1');
        goTo('dashScreen');
      } else {
        msg.textContent = '❌ RM ou nome incorretos.';
        msg.className = 'msg danger';
        rmI.classList.add('error'); nmI.classList.add('error');
        setTimeout(() => { rmI.classList.remove('error'); nmI.classList.remove('error'); }, 600);
      }
      btn.disabled = false; btn.textContent = 'Entrar';
    }, 700);
  }

  function logout() {
    localStorage.removeItem('logado');
    document.getElementById('rmInput').value = '';
    document.getElementById('nomeInput').value = '';
    goTo('welcomeScreen');
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && document.getElementById('loginScreen').classList.contains('active')) login();
  });

  // Auto-login
  if (localStorage.getItem('logado')) {
    document.getElementById('welcomeName').textContent = 'RENAN';
    document.getElementById('welcomeRM').textContent = 'RM: 26567';
    goTo('dashScreen');
  }
</script>

<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  }
</script>
</body>
</html>
